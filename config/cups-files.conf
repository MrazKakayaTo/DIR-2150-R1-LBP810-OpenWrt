# CUPS file/directory configuration for DIR-2150.
# Store queued jobs on overlay flash so they do not exhaust 128 MiB of RAM.
# Print occasionally; heavy spooling will increase flash wear.

User nobody
Group nogroup
SystemGroup root

AccessLog syslog
ErrorLog syslog
PageLog syslog

RequestRoot /overlay/lbp810-cups/spool
TempDir /overlay/lbp810-cups/tmp
CacheDir /tmp/lbp810-cups/cache
StateDir /var/run/cups
ServerBin /usr/lib/cups
ServerRoot /etc/cups
