# CUPS for OpenWrt 25.12.5 / Canon LBP-810.
# Managed locally via SSH, with printing allowed only from local interfaces.

LogLevel warn

ServerAlias *
Listen @ROUTER_LAN_IP@:631
Listen /var/run/cups/cups.sock
Browsing Off
DefaultShared Yes
WebInterface No
HostNameLookups Off

MaxJobs 4
MaxJobsPerPrinter 2
MaxRequestSize 33554432
MaxCopies 30
RIPCache 2m
PreserveJobHistory No
PreserveJobFiles No
AutoPurgeJobs Yes

<Location />
  Order allow,deny
  Allow from @LOCAL
</Location>

<Location /admin>
  Order allow,deny
  Allow from localhost
</Location>
